<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fro & Co. iPhone Audio Diagnostic</title><style>body{background:#100d1c;color:#fff;font:16px system-ui;padding:24px;max-width:650px;margin:auto}button{display:block;width:100%;padding:18px;margin:15px 0;border:0;border-radius:12px;background:#aa7aff;color:#160d25;font-weight:800;font-size:17px}pre{white-space:pre-wrap;background:#211a32;padding:18px;border-radius:12px;line-height:1.6}h1{color:#ffd48c}</style></head><body><h1>🎤 Fro & Co. Audio Test</h1><p>Open in Safari. Turn up media volume, then tap each button. This page does not connect to the game or change any settings.</p><button id="beep">1. Test electronic beep</button><button id="voice">2. Test spoken voice</button><button id="reset">Clear results</button><pre id="log">Ready. Tap Test electronic beep.</pre><script>
const log=document.getElementById('log');function report(s){log.textContent+='\n'+new Date().toLocaleTimeString()+': '+s}let ctx;
document.getElementById('beep').onclick=async()=>{report('Beep tapped.');try{const A=window.AudioContext||window.webkitAudioContext;if(!A){report('AudioContext NOT SUPPORTED');return}ctx ||= new A();report('Initial state: '+ctx.state);await ctx.resume();report('After resume: '+ctx.state);const osc=ctx.createOscillator(),gain=ctx.createGain(),t=ctx.currentTime;osc.type='sine';osc.frequency.setValueAtTime(660,t);gain.gain.setValueAtTime(0.001,t);gain.gain.linearRampToValueAtTime(0.35,t+0.05);gain.gain.setValueAtTime(0.35,t+0.55);gain.gain.linearRampToValueAtTime(0.001,t+0.7);osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+0.72);osc.onended=()=>report('Beep oscillator finished. Did you hear it?')}catch(e){report('Beep ERROR: '+e.name+' '+e.message)}};
document.getElementById('voice').onclick=()=>{report('Voice tapped.');try{if(!('speechSynthesis' in window)){report('Speech synthesis NOT SUPPORTED');return}const ss=window.speechSynthesis;ss.cancel();report('Speech synthesis present. Voices loaded: '+ss.getVoices().length);const u=new SpeechSynthesisUtterance('Testing, testing. The Wise Guy has entered the building.');u.lang='en-US';u.rate=0.95;u.volume=1;u.onstart=()=>report('Speech STARTED');u.onend=()=>report('Speech ENDED');u.onerror=e=>report('Speech ERROR: '+e.error);ss.speak(u);report('Speech requested. Pending: '+ss.pending+', speaking: '+ss.speaking);setTimeout(()=>report('After 3 seconds — pending: '+ss.pending+', speaking: '+ss.speaking),3000)}catch(e){report('Voice ERROR: '+e.name+' '+e.message)}};
document.getElementById('reset').onclick=()=>{log.textContent='Ready.'};
</script></body></html>
